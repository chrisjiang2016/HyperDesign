<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - HTML 原型分享平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .forgot-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 48px 40px;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            margin-bottom: 16px;
        }

        .logo h1 {
            font-size: 24px;
            color: #1a202c;
            margin-bottom: 8px;
        }

        .logo p {
            font-size: 14px;
            color: #718096;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f7fafc;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fff5f5;
            border: 1px solid #fc8181;
            color: #c53030;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            margin: 10% auto;
            padding: 40px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            animation: modalSlideUp 0.3s ease;
        }

        @keyframes modalSlideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-icon {
            width: 80px;
            height: 80px;
            background: #48bb78;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 24px;
        }

        .modal-content h2 {
            font-size: 24px;
            color: #1a202c;
            margin-bottom: 16px;
        }

        .modal-content p {
            font-size: 15px;
            color: #4a5568;
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .new-password {
            background: #f7fafc;
            border: 2px dashed #cbd5e0;
            padding: 16px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 700;
            color: #2d3748;
            letter-spacing: 2px;
            margin: 20px 0;
        }

        .modal-buttons {
            margin-top: 32px;
        }

        .btn-modal {
            padding: 12px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-modal:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="forgot-container">
        <div class="logo">
            <div class="logo-icon">🔒</div>
            <h1>重置密码</h1>
            <p>输入您的用户名，我们将为您生成新的临时密码</p>
        </div>

        <div class="error-message" id="errorMessage">
            用户名不存在，请检查后重新输入
        </div>

        <form id="forgotForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="请输入您的用户名"
                    required
                >
            </div>

            <button type="submit" class="btn-primary">重置密码</button>
        </form>

        <div class="back-link">
            <a href="login.html">← 返回登录</a>
        </div>
    </div>

    <!-- 重置成功模态框 -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <div class="modal-icon">✓</div>
            <h2>密码重置成功</h2>
            <p>您的新密码为：</p>
            <div class="new-password" id="newPassword">abc123</div>
            <p style="color: #e53e3e; font-weight: 500;">请妥善保管此密码，建议登录后立即修改</p>
            <div class="modal-buttons">
                <button class="btn-modal" onclick="goToLogin()">前往登录</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('forgotForm');
        const errorMessage = document.getElementById('errorMessage');
        const successModal = document.getElementById('successModal');
        const newPasswordElement = document.getElementById('newPassword');

        // 生成随机密码
        function generatePassword() {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let password = '';
            for (let i = 0; i < 8; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return password;
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            
            // 模拟检查用户名是否存在（这里简化处理，实际应该调用后端接口）
            if (username.length >= 5) {
                // 生成新密码
                const newPassword = generatePassword();
                newPasswordElement.textContent = newPassword;
                
                // 显示成功模态框
                successModal.style.display = 'block';
            } else {
                // 显示错误信息
                errorMessage.classList.add('show');
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 3000);
            }
        });

        function goToLogin() {
            window.location.href = 'login.html';
        }

        // 点击模态框外部关闭
        window.onclick = function(event) {
            if (event.target == successModal) {
                successModal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
