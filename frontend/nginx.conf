server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite emits content-hashed JS/CSS assets. Cache them aggressively and
  # compress text responses at the edge; a new deployment gets new filenames,
  # while repeat visits avoid transferring the application bundle again.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

  # Keep the edge proxy limit aligned with MAX_UPLOAD_BYTES (100 MiB by
  # default). Without this Nginx's 1 MiB default rejects prototype ZIPs
  # before the NestJS upload validation can run.
  client_max_body_size 100m;

  location /api/ {
    proxy_pass http://api:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~* ^/assets/ {
    # `expires` already emits max-age=31536000; add only the immutable
    # directive to avoid producing duplicate Cache-Control max-age values.
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
