services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: hyperdesign
      MYSQL_USER: hyperdesign
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - hyperdesign-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "hyperdesign", "-p${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--save", "60", "1"]
    volumes:
      - hyperdesign-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ../backend
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      DATABASE_URL: mysql://hyperdesign:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/hyperdesign
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      STORAGE_LOCAL_ROOT: /app/storage
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
    volumes:
      - ${STORAGE_HOST_PATH:-./storage}:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ../frontend
    environment:
      API_PROXY_URL: http://api:3001
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    volumes:
      - ${STORAGE_HOST_PATH:-./storage}:/app/storage:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hyperdesign-mysql:
  hyperdesign-redis:
