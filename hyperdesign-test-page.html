<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperDesign 前端测试页面</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .test-section h2 {
            margin-top: 0;
            color: #333;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #1890ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #40a9ff;
        }
        .result {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
        .success {
            border-color: #52c41a;
            background: #f6ffed;
        }
        .error {
            border-color: #ff4d4f;
            background: #fff1f0;
        }
        input {
            padding: 8px 12px;
            margin: 5px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            width: 200px;
        }
        .iframe-container {
            border: 2px solid #1890ff;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 15px;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: none;
        }
    </style>
</head>
<body>
    <h1>🧪 HyperDesign 前端功能测试</h1>
    <p><strong>服务器地址:</strong> <code>http://47.114.41.30:8080</code></p>

    <!-- 测试 1: 检查前端是否可访问 -->
    <div class="test-section">
        <h2>测试 1: 检查前端页面加载</h2>
        <p>在下面的 iframe 中直接加载 HyperDesign 前端，查看是否能正常显示：</p>
        <button onclick="loadFrontend()">加载前端首页</button>
        <button onclick="loadLogin()">加载登录页</button>
        <button onclick="loadRegister()">加载注册页</button>
        <div class="iframe-container" id="frontendIframe" style="display:none;">
            <iframe id="iframe" src="about:blank"></iframe>
        </div>
    </div>

    <!-- 测试 2: API 连接测试 -->
    <div class="test-section">
        <h2>测试 2: API 连接测试</h2>
        <button onclick="testHealthCheck()">健康检查 API</button>
        <button onclick="testRegisterAPI()">测试注册 API</button>
        <button onclick="testLoginAPI()">测试登录 API</button>
        <div id="apiResult" class="result" style="display:none;"></div>
    </div>

    <!-- 测试 3: 注册功能测试 -->
    <div class="test-section">
        <h2>测试 3: 用户注册测试</h2>
        <div>
            <input type="text" id="regUsername" placeholder="用户名 (5-64位字母数字)" value="testuser999">
            <input type="password" id="regPassword" placeholder="密码 (6-128位字母数字)" value="Test123456">
        </div>
        <button onclick="testRegister()">执行注册</button>
        <div id="registerResult" class="result" style="display:none;"></div>
    </div>

    <!-- 测试 4: 登录功能测试 -->
    <div class="test-section">
        <h2>测试 4: 用户登录测试</h2>
        <div>
            <input type="text" id="loginUsername" placeholder="用户名" value="chrisjiang">
            <input type="password" id="loginPassword" placeholder="密码" value="jiangly12345">
        </div>
        <button onclick="testLogin()">执行登录</button>
        <div id="loginResult" class="result" style="display:none;"></div>
    </div>

    <script>
        const API_BASE = 'http://47.114.41.30:8080/api';
        const FRONTEND_BASE = 'http://47.114.41.30:8080';

        function showResult(elementId, content, isSuccess = true) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.className = 'result ' + (isSuccess ? 'success' : 'error');
            element.textContent = content;
        }

        function loadFrontend() {
            document.getElementById('frontendIframe').style.display = 'block';
            document.getElementById('iframe').src = FRONTEND_BASE + '/';
        }

        function loadLogin() {
            document.getElementById('frontendIframe').style.display = 'block';
            document.getElementById('iframe').src = FRONTEND_BASE + '/login';
        }

        function loadRegister() {
            document.getElementById('frontendIframe').style.display = 'block';
            document.getElementById('iframe').src = FRONTEND_BASE + '/register';
        }

        async function testHealthCheck() {
            try {
                const response = await fetch(API_BASE + '/health');
                const data = await response.json();
                showResult('apiResult', 
                    `状态码: ${response.status}\n` +
                    `响应数据:\n${JSON.stringify(data, null, 2)}`,
                    response.ok
                );
            } catch (error) {
                showResult('apiResult', `错误: ${error.message}`, false);
            }
        }

        async function testRegisterAPI() {
            try {
                const response = await fetch(API_BASE + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: 'apitest001',
                        confirmUsername: 'apitest001',
                        password: 'Test123456'
                    })
                });
                const data = await response.json();
                showResult('apiResult', 
                    `状态码: ${response.status}\n` +
                    `响应数据:\n${JSON.stringify(data, null, 2)}`,
                    response.ok
                );
            } catch (error) {
                showResult('apiResult', `错误: ${error.message}`, false);
            }
        }

        async function testLoginAPI() {
            try {
                const response = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        username: 'chrisjiang',
                        password: 'jiangly12345'
                    })
                });
                const data = await response.json();
                showResult('apiResult', 
                    `状态码: ${response.status}\n` +
                    `响应数据:\n${JSON.stringify(data, null, 2)}`,
                    response.ok
                );
            } catch (error) {
                showResult('apiResult', `错误: ${error.message}`, false);
            }
        }

        async function testRegister() {
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;

            if (!username || !password) {
                showResult('registerResult', '请填写用户名和密码', false);
                return;
            }

            try {
                const response = await fetch(API_BASE + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        confirmUsername: username,
                        password: password
                    })
                });
                const data = await response.json();
                showResult('registerResult', 
                    `状态码: ${response.status}\n` +
                    `响应数据:\n${JSON.stringify(data, null, 2)}`,
                    response.ok
                );
            } catch (error) {
                showResult('registerResult', `错误: ${error.message}`, false);
            }
        }

        async function testLogin() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showResult('loginResult', '请填写用户名和密码', false);
                return;
            }

            try {
                const response = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                const data = await response.json();
                const cookies = document.cookie;
                showResult('loginResult', 
                    `状态码: ${response.status}\n` +
                    `响应数据:\n${JSON.stringify(data, null, 2)}\n\n` +
                    `Cookies: ${cookies || '(无)'}`,
                    response.ok
                );
            } catch (error) {
                showResult('loginResult', `错误: ${error.message}`, false);
            }
        }
    </script>
</body>
</html>
