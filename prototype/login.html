<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - HyperDesign</title>
    <style>
        :root {
            --bg-page: #f8fafc;
            --bg-surface: #ffffff;
            --bg-muted: #f6f8fb;
            --text-primary: #111827;
            --text-secondary: #475467;
            --text-tertiary: #98a2b3;
            --border-light: #eaecf0;
            --brand: #2563eb;
            --brand-hover: #1d4ed8;
            --brand-soft: #eff6ff;
            --danger: #dc2626;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.08);
            --shadow-md: 0 4px 12px rgba(16, 24, 40, 0.08), 0 8px 32px rgba(16, 24, 40, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-page);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        a { color: var(--brand); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .auth-shell {
            width: 100%;
            max-width: 440px;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-mark {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: var(--brand);
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .brand-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .brand-header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .auth-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-md);
        }

        .tab-row {
            display: flex;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 28px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: .15s ease;
        }

        .tab.active {
            color: var(--brand);
            border-bottom-color: var(--brand);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-size: 15px;
            transition: .15s ease;
            background: var(--bg-surface);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .forgot-link {
            font-size: 14px;
            color: var(--brand);
            font-weight: 500;
        }

        .btn-primary {
            width: 100%;
            height: 44px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: .15s ease;
            margin-bottom: 16px;
        }

        .btn-primary:hover {
            background: var(--brand-hover);
            transform: translateY(-1px);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border-light);
        }

        .divider-text {
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .social-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .social-btn {
            flex: 1;
            height: 42px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            background: var(--bg-surface);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: .15s ease;
        }

        .social-btn:hover {
            background: var(--bg-muted);
        }

        .signup-prompt {
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .signup-prompt a {
            font-weight: 600;
            margin-left: 4px;
        }

        .error-message {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: var(--radius-sm);
            color: var(--danger);
            font-size: 13px;
            margin-bottom: 20px;
        }

        .demo-note {
            margin-top: 24px;
            padding: 16px;
            background: var(--brand-soft);
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--brand);
            line-height: 1.6;
        }

        .demo-note strong {
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="brand-header">
            <div class="brand-mark">H</div>
            <h1>欢迎使用 HyperDesign</h1>
            <p>登录你的账号，继续原型协作之旅</p>
        </div>

        <div class="auth-card">
            <div class="tab-row">
                <div class="tab active">账号密码登录</div>
                <div class="tab">手机号登录</div>
            </div>

            <div class="form-group">
                <label>邮箱地址</label>
                <input type="email" placeholder="请输入邮箱地址" value="admin@hyperdesign.io">
            </div>

            <div class="form-group">
                <label>密码</label>
                <input type="password" placeholder="请输入密码" value="••••••••">
            </div>

            <div class="form-row">
                <label class="remember-me">
                    <input type="checkbox" checked>
                    <span>记住我</span>
                </label>
                <a href="forgot-password.html" class="forgot-link">忘记密码？</a>
            </div>

            <button class="btn-primary" onclick="window.location.href='index.html'">登录</button>

            <div class="divider">
                <div class="divider-line"></div>
                <div class="divider-text">或使用以下方式登录</div>
                <div class="divider-line"></div>
            </div>

            <div class="social-buttons">
                <button class="social-btn">
                    <span>📧</span>
                    <span>Google</span>
                </button>
                <button class="social-btn">
                    <span>💬</span>
                    <span>微信</span>
                </button>
                <button class="social-btn">
                    <span>🔷</span>
                    <span>飞书</span>
                </button>
            </div>

            <div class="signup-prompt">
                还没有账号？
                <a href="register.html">立即注册</a>
            </div>
        </div>

        <div class="demo-note">
            <strong>💡 演示提示：</strong>点击"登录"按钮可直接进入工作台首页。
            本演示已预置测试账号，你可以体验完整的团队、项目、原型预览流程。
        </div>
    </div>
</body>
</html>
