<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - HyperDesign</title>
    <style>
        :root {
            --bg-page: #f8fafc;
            --bg-surface: #ffffff;
            --bg-muted: #f6f8fb;
            --text-primary: #111827;
            --text-secondary: #475467;
            --text-tertiary: #98a2b3;
            --border-light: #eaecf0;
            --brand: #2563eb;
            --brand-hover: #1d4ed8;
            --brand-soft: #eff6ff;
            --success: #027a48;
            --success-soft: #ecfdf3;
            --warning: #c2410c;
            --warning-soft: #fff7ed;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.08);
            --shadow-md: 0 4px 12px rgba(16, 24, 40, 0.08), 0 8px 32px rgba(16, 24, 40, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-page);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        a { color: var(--brand); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .auth-shell {
            width: 100%;
            max-width: 440px;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-mark {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: var(--brand);
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .brand-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .brand-header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .auth-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-md);
        }

        .step-indicator {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }

        .step {
            flex: 1;
            text-align: center;
            font-size: 13px;
            color: var(--text-tertiary);
            position: relative;
        }

        .step::after {
            content: "";
            position: absolute;
            top: 11px;
            left: calc(50% + 16px);
            right: 0;
            height: 2px;
            background: var(--border-light);
        }

        .step:last-child::after {
            display: none;
        }

        .step.active {
            color: var(--brand);
            font-weight: 600;
        }

        .step.active::after {
            background: var(--brand);
        }

        .step-num {
            width: 24px;
            height: 24px;
            border-radius: 999px;
            background: var(--bg-muted);
            color: var(--text-tertiary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .step.active .step-num {
            background: var(--brand);
            color: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-size: 15px;
            transition: .15s ease;
            background: var(--bg-surface);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }

        .verify-row {
            display: flex;
            gap: 12px;
        }

        .verify-row input {
            flex: 1;
        }

        .btn-verify {
            height: 44px;
            padding: 0 16px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            background: var(--bg-surface);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: .15s ease;
        }

        .btn-verify:hover {
            background: var(--bg-muted);
        }

        .btn-verify:disabled {
            color: var(--text-tertiary);
            cursor: not-allowed;
        }

        .btn-primary {
            width: 100%;
            height: 44px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: .15s ease;
            margin-bottom: 16px;
        }

        .btn-primary:hover {
            background: var(--brand-hover);
            transform: translateY(-1px);
        }

        .login-prompt {
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .login-prompt a {
            font-weight: 600;
            margin-left: 4px;
        }

        .tip-box {
            padding: 14px 16px;
            background: var(--brand-soft);
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--brand);
            line-height: 1.6;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .success-state {
            text-align: center;
            padding: 20px 0;
        }

        .success-icon {
            width: 72px;
            height: 72px;
            border-radius: 999px;
            background: var(--success-soft);
            color: var(--success);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .success-state h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .success-state p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="brand-header">
            <div class="brand-mark">H</div>
            <h1>重置你的密码</h1>
            <p>按步骤完成密码重置，重新登录你的账号</p>
        </div>

        <div class="auth-card" id="step1">
            <div class="step-indicator">
                <div class="step active">
                    <div class="step-num">1</div>
                    <div>验证邮箱</div>
                </div>
                <div class="step">
                    <div class="step-num">2</div>
                    <div>设置新密码</div>
                </div>
                <div class="step">
                    <div class="step-num">3</div>
                    <div>完成</div>
                </div>
            </div>

            <div class="tip-box">
                <span>💡</span>
                <span>请输入你注册时使用的邮箱地址，我们将向该邮箱发送验证码。</span>
            </div>

            <div class="form-group">
                <label>邮箱地址</label>
                <input type="email" placeholder="请输入注册邮箱" value="admin@hyperdesign.io">
            </div>

            <button class="btn-primary" onclick="goToStep2()">发送验证码</button>

            <div class="login-prompt">
                想起密码了？
                <a href="login.html">返回登录</a>
            </div>
        </div>
    </div>

    <script>
        function goToStep2() {
            const card = document.querySelector('.auth-card');
            card.innerHTML = `
                <div class="step-indicator">
                    <div class="step active">
                        <div class="step-num">1</div>
                        <div>验证邮箱</div>
                    </div>
                    <div class="step active">
                        <div class="step-num">2</div>
                        <div>设置新密码</div>
                    </div>
                    <div class="step">
                        <div class="step-num">3</div>
                        <div>完成</div>
                    </div>
                </div>

                <div class="tip-box" style="background:var(--warning-soft);color:var(--warning)">
                    <span>📧</span>
                    <span>验证码已发送至 admin@hyperdesign.io，10 分钟内有效。</span>
                </div>

                <div class="form-group">
                    <label>邮箱验证码</label>
                    <div class="verify-row">
                        <input type="text" placeholder="请输入6位验证码" maxlength="6">
                        <button class="btn-verify" disabled>59s 后重发</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>新密码</label>
                    <input type="password" placeholder="至少8位，包含字母和数字">
                </div>

                <div class="form-group">
                    <label>确认新密码</label>
                    <input type="password" placeholder="再次输入新密码">
                </div>

                <button class="btn-primary" onclick="goToStep3()">确认重置密码</button>

                <div class="login-prompt">
                    想起密码了？
                    <a href="login.html">返回登录</a>
                </div>
            `;
        }

        function goToStep3() {
            const card = document.querySelector('.auth-card');
            card.innerHTML = `
                <div class="step-indicator">
                    <div class="step active">
                        <div class="step-num">1</div>
                        <div>验证邮箱</div>
                    </div>
                    <div class="step active">
                        <div class="step-num">2</div>
                        <div>设置新密码</div>
                    </div>
                    <div class="step active">
                        <div class="step-num">3</div>
                        <div>完成</div>
                    </div>
                </div>

                <div class="success-state">
                    <div class="success-icon">✓</div>
                    <h2>密码重置成功！</h2>
                    <p>
                        你的密码已成功更新。请使用新密码重新登录你的账号，
                        继续使用 HyperDesign 进行原型协作。
                    </p>
                    <button class="btn-primary" onclick="window.location.href='login.html'">前往登录</button>
                </div>
            `;
        }
    </script>
</body>
</html>
